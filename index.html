<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinterArc • Winter Arc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #FAF8F5;
            color: #4A403A;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto px-5 py-6">

    <!-- Header -->
    <header class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-xl font-bold tracking-wider text-stone-800">ELEVATE</h1>
            <p id="current-date-display" class="text-xs text-stone-400 capitalize mt-0.5"></p>
        </div>
        <div class="flex items-center space-x-1.5 bg-rose-50/80 border border-rose-100/80 px-3 py-1.5 rounded-full shadow-sm">
            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-rose-400"></i>
            <span id="streak-count" class="text-xs font-semibold text-rose-700">0 jours</span>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="flex space-x-1.5 bg-white/80 p-1.5 rounded-2xl border border-stone-200/60 shadow-sm mb-6 backdrop-blur-sm">
        <button onclick="switchTab('daily')" id="tab-daily" class="flex-1 py-2 px-3 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1.5 transition-all bg-emerald-50 text-emerald-800 border border-emerald-100 shadow-sm">
            <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>
            <span>Rituels</span>
        </button>
        <button onclick="switchTab('calendar')" id="tab-calendar" class="flex-1 py-2 px-3 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1.5 transition-all text-stone-400 hover:text-stone-700">
            <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
            <span>Calendrier</span>
        </button>
        <button onclick="switchTab('progress')" id="tab-progress" class="flex-1 py-2 px-3 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1.5 transition-all text-stone-400 hover:text-stone-700">
            <i data-lucide="trophy" class="w-3.5 h-3.5"></i>
            <span>Mon Arc</span>
        </button>
    </nav>

    <!-- PAGE 1: RITUELS DU JOUR -->
    <main id="view-daily" class="space-y-5 flex-grow">
        <!-- Carte Progression du jour -->
        <div class="bg-white rounded-3xl p-5 border border-stone-100 shadow-sm flex items-center justify-between">
            <div>
                <span class="text-xs font-medium text-stone-400 uppercase tracking-wider">Aujourd'hui</span>
                <h2 class="text-lg font-bold text-stone-800">Rituels Quotidiens</h2>
                <p id="daily-subtext" class="text-xs text-emerald-600 font-medium mt-0.5">0 sur 0 complétés</p>
            </div>
            <div class="relative flex items-center justify-center">
                <div id="daily-completion-badge" class="text-sm font-bold text-stone-700">0%</div>
            </div>
        </div>

        <!-- Liste des tâches -->
        <div id="task-list" class="space-y-3"></div>

        <!-- Ajouter une habitude -->
        <form onsubmit="addTask(event)" class="flex gap-2 pt-2">
            <input type="text" id="new-task-input" placeholder="Nouveau rituel..." class="flex-1 bg-white border border-stone-200/80 rounded-2xl px-4 py-2.5 text-xs focus:outline-none focus:border-emerald-300 text-stone-700 placeholder-stone-300 shadow-sm">
            <button type="submit" class="bg-stone-800 text-white p-2.5 rounded-2xl transition-colors shadow-sm">
                <i data-lucide="plus" class="w-4 h-4"></i>
            </button>
        </form>

        <!-- Mini Journal -->
        <div class="bg-white/60 rounded-3xl p-4 border border-stone-100/80 shadow-sm space-y-2 mt-4">
            <span class="text-xs font-semibold text-stone-400 uppercase tracking-wider flex items-center gap-1.5">
                <i data-lucide="heart" class="w-3.5 h-3.5 text-rose-300"></i> Gratitude du jour
            </span>
            <textarea id="daily-note" onchange="saveNote(this.value)" placeholder="Un petit mot doux sur votre journée..." class="w-full bg-transparent text-xs text-stone-600 placeholder-stone-300 focus:outline-none resize-none h-16"></textarea>
        </div>
    </main>

    <!-- PAGE 2: CALENDRIER -->
    <main id="view-calendar" class="space-y-5 flex-grow hidden">
        <div class="bg-white rounded-3xl p-5 border border-stone-100 shadow-sm">
            <div class="flex justify-between items-center mb-5">
                <h2 id="calendar-month-title" class="text-base font-bold text-stone-800 capitalize">Mois</h2>
                <div class="flex gap-1.5">
                    <button onclick="changeMonth(-1)" class="p-1.5 rounded-xl bg-stone-50 text-stone-500 hover:bg-stone-100"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                    <button onclick="changeMonth(1)" class="p-1.5 rounded-xl bg-stone-50 text-stone-500 hover:bg-stone-100"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                </div>
            </div>

            <div class="grid grid-cols-7 gap-1.5 text-center text-[10px] font-bold text-stone-300 mb-2">
                <div>LUN</div><div>MAR</div><div>MER</div><div>JEU</div><div>VEN</div><div>SAM</div><div>DIM</div>
            </div>

            <div id="calendar-grid" class="grid grid-cols-7 gap-1.5"></div>

            <div class="flex items-center justify-around mt-5 text-[11px] text-stone-400 pt-3 border-t border-stone-50">
                <div class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-200"></span> 100%</div>
                <div class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-200"></span> &ge;50%</div>
                <div class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-rose-200"></span> &lt;50%</div>
            </div>
        </div>
    </main>

    <!-- PAGE 3: PROGRESSION 75 JOURS -->
    <main id="view-progress" class="space-y-5 flex-grow hidden">
        <div class="bg-white rounded-3xl p-5 border border-stone-100 shadow-sm space-y-5">
            <div class="text-center py-4 bg-rose-50/30 rounded-2xl border border-rose-100/50">
                <div id="total-progress-percent" class="text-4xl font-extrabold text-stone-800 mb-1">0%</div>
                <div id="total-progress-days" class="text-xs font-semibold text-stone-400">Jour 1 sur 75</div>
            </div>

            <div class="space-y-1.5">
                <div class="flex justify-between text-[11px] font-medium text-stone-400">
                    <span>Départ</span>
                    <span>Objectif 75 Jours</span>
                </div>
                <div class="w-full bg-stone-100 h-3 rounded-full overflow-hidden p-0.5">
                    <div id="total-progress-bar" class="bg-gradient-to-r from-rose-200 via-amber-200 to-emerald-200 h-full rounded-full w-0 transition-all duration-700"></div>
                </div>
            </div>

            <div class="pt-3 border-t border-stone-100">
                <label class="block text-xs font-medium text-stone-400 mb-1.5">Date de démarrage :</label>
                <input type="date" id="start-date-input" onchange="updateStartDate(this.value)" class="bg-stone-50 border border-stone-200 text-stone-700 text-xs rounded-xl px-3 py-2 w-full focus:outline-none">
            </div>
        </div>
    </main>

    <footer class="mt-6 text-center text-[10px] text-stone-300">
        ELEVATE • Winter Arc Edition
    </footer>

<script>
    const DEFAULT_TASKS = [
        "Réveil matinal doux",
        "45 min Pilates / Marche",
        "Lecture & Inspiration",
        "Hydratation (2L d'eau)",
        "Nourriture saine & équilibrée"
    ];

    let tasks = JSON.parse(localStorage.getItem('elevate_tasks')) || DEFAULT_TASKS;
    let history = JSON.parse(localStorage.getItem('elevate_history')) || {};
    let notes = JSON.parse(localStorage.getItem('elevate_notes')) || {};
    let startDate = localStorage.getItem('elevate_start_date') || getBrusselsDateString();
    let currentCalendarDate = new Date();

    function getBrusselsDateString(d = new Date()) {
        const options = { timeZone: 'Europe/Brussels', year: 'numeric', month: '2-digit', day: '2-digit' };
        return new Intl.DateTimeFormat('fr-CA', options).format(d);
    }

    function init() {
        document.getElementById('start-date-input').value = startDate;
        renderTasks();
        renderCalendar();
        renderProgress();
        updateHeader();
        loadNote();
        lucide.createIcons();
    }

    function updateHeader() {
        const today = new Date().toLocaleDateString('fr-FR', { timeZone: 'Europe/Brussels', weekday: 'long', day: 'numeric', month: 'long' });
        document.getElementById('current-date-display').innerText = today;

        let streak = 0;
        let curr = new Date();
        while (true) {
            let key = getBrusselsDateString(curr);
            let dayData = history[key];
            if (dayData && dayData.completed && tasks.length > 0 && (dayData.completed.length / tasks.length) === 1) {
                streak++;
                curr.setDate(curr.getDate() - 1);
            } else if (key === getBrusselsDateString()) {
                curr.setDate(curr.getDate() - 1);
            } else {
                break;
            }
        }
        document.getElementById('streak-count').innerText = `${streak} jour${streak > 1 ? 's' : ''}`;
    }

    function switchTab(tab) {
        ['daily', 'calendar', 'progress'].forEach(t => {
            document.getElementById(`view-${t}`).classList.add('hidden');
            document.getElementById(`tab-${t}`).className = "flex-1 py-2 px-3 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1.5 transition-all text-stone-400 hover:text-stone-700";
        });

        document.getElementById(`view-${tab}`).classList.remove('hidden');
        const activeBtn = document.getElementById(`tab-${tab}`);
        
        if (tab === 'daily') activeBtn.className = "flex-1 py-2 px-3 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1.5 transition-all bg-emerald-50 text-emerald-800 border border-emerald-100 shadow-sm";
        if (tab === 'calendar') activeBtn.className = "flex-1 py-2 px-3 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1.5 transition-all bg-amber-50 text-amber-800 border border-amber-100 shadow-sm";
        if (tab === 'progress') activeBtn.className = "flex-1 py-2 px-3 rounded-xl text-xs font-semibold flex items-center justify-center space-x-1.5 transition-all bg-rose-50 text-rose-800 border border-rose-100 shadow-sm";

        if(tab === 'calendar') renderCalendar();
        if(tab === 'progress') renderProgress();
    }

    function renderTasks() {
        const todayKey = getBrusselsDateString();
        if (!history[todayKey]) history[todayKey] = { completed: [] };

        const taskListEl = document.getElementById('task-list');
        taskListEl.innerHTML = '';

        const completedSet = new Set(history[todayKey].completed);

        tasks.forEach((task, index) => {
            const isChecked = completedSet.has(task);
            const item = document.createElement('div');
            item.className = `flex items-center justify-between p-3 rounded-2xl border transition-all ${
                isChecked ? 'bg-emerald-50/50 border-emerald-100' : 'bg-white border-stone-100/80 shadow-sm'
            }`;
            item.innerHTML = `
                <label class="flex items-center space-x-3 cursor-pointer flex-1">
                    <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleTask('${task.replace(/'/g, "\\'")}')" class="w-4 h-4 rounded border-stone-300 text-emerald-500 focus:ring-emerald-200">
                    <span class="text-xs font-medium ${isChecked ? 'line-through text-stone-300' : 'text-stone-700'}">${task}</span>
                </label>
                <button onclick="deleteTask(${index})" class="text-stone-200 hover:text-rose-400 p-1">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                </button>
            `;
            taskListEl.appendChild(item);
        });

        const pct = tasks.length > 0 ? Math.round((completedSet.size / tasks.length) * 100) : 0;
        document.getElementById('daily-completion-badge').innerText = `${pct}%`;
        document.getElementById('daily-subtext').innerText = `${completedSet.size} sur ${tasks.length} complétés`;

        lucide.createIcons();
    }

    function toggleTask(task) {
        const todayKey = getBrusselsDateString();
        let completed = history[todayKey].completed || [];

        if (completed.includes(task)) {
            completed = completed.filter(t => t !== task);
        } else {
            completed.push(task);
        }

        history[todayKey].completed = completed;
        localStorage.setItem('elevate_history', JSON.stringify(history));
        renderTasks();
        updateHeader();
    }

    function addTask(e) {
        e.preventDefault();
        const input = document.getElementById('new-task-input');
        const val = input.value.trim();
        if (val) {
            tasks.push(val);
            localStorage.setItem('elevate_tasks', JSON.stringify(tasks));
            input.value = '';
            renderTasks();
        }
    }

    function deleteTask(index) {
        tasks.splice(index, 1);
        localStorage.setItem('elevate_tasks', JSON.stringify(tasks));
        renderTasks();
    }

    function saveNote(val) {
        const todayKey = getBrusselsDateString();
        notes[todayKey] = val;
        localStorage.setItem('elevate_notes', JSON.stringify(notes));
    }

    function loadNote() {
        const todayKey = getBrusselsDateString();
        document.getElementById('daily-note').value = notes[todayKey] || '';
    }

    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';

        const year = currentCalendarDate.getFullYear();
        const month = currentCalendarDate.getMonth();

        document.getElementById('calendar-month-title').innerText = new Date(year, month).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);

        let startingDay = firstDay.getDay() - 1;
        if (startingDay === -1) startingDay = 6;

        for (let i = 0; i < startingDay; i++) grid.appendChild(document.createElement('div'));

        for (let day = 1; day <= lastDay.getDate(); day++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const cell = document.createElement('div');

            const dayData = history[dateStr];
            let bgColor = 'bg-stone-50 text-stone-300 border-transparent';

            if (dayData && dayData.completed && tasks.length > 0) {
                const ratio = dayData.completed.length / tasks.length;
                if (ratio === 1) bgColor = 'bg-emerald-100 text-emerald-800 border-emerald-200 font-bold';
                else if (ratio >= 0.5) bgColor = 'bg-amber-100 text-amber-800 border-amber-200 font-medium';
                else if (ratio > 0) bgColor = 'bg-rose-100 text-rose-800 border-rose-200 font-medium';
            }

            const isToday = dateStr === getBrusselsDateString();
            cell.className = `aspect-square rounded-xl border flex items-center justify-center text-xs transition-all ${bgColor} ${isToday ? 'ring-2 ring-stone-400' : ''}`;
            cell.innerText = day;
            grid.appendChild(cell);
        }
    }

    function changeMonth(delta) {
        currentCalendarDate.setMonth(currentCalendarDate.getMonth() + delta);
        renderCalendar();
    }

    function renderProgress() {
        const start = new Date(startDate);
        const today = new Date(getBrusselsDateString());
        const diffTime = today - start;
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;

        const currentDayNum = Math.max(1, Math.min(75, diffDays));
        const progressPct = Math.round((currentDayNum / 75) * 100);

        document.getElementById('total-progress-percent').innerText = `${progressPct}%`;
        document.getElementById('total-progress-days').innerText = `Jour ${currentDayNum} sur 75`;
        document.getElementById('total-progress-bar').style.width = `${progressPct}%`;
    }

    function updateStartDate(val) {
        if (val) {
            startDate = val;
            localStorage.setItem('elevate_start_date', val);
            renderProgress();
            updateHeader();
        }
    }

    window.onload = init;
</script>
</body>
</html>
