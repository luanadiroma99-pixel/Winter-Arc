    <script>
        const LI = {
            'flame': '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
            'check-square': '<path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
            'calendar': '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
            'trophy': '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
            'list-todo': '<rect x="3" y="5" width="6" height="6" rx="1"/><path d="m3 17 2 2 4-4M13 6h8M13 12h8M13 18h8"/>',
            'plus': '<path d="M5 12h14M12 5v14"/>',
            'trash-2': '<path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6"/>',
            'chevron-left': '<path d="m15 18-6-6 6-6"/>',
            'chevron-right': '<path d="m9 18 6-6-6-6"/>',
            'dumbbell': '<path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/>'
        };
        window.lucide = {
            createIcons() {
                document.querySelectorAll('i[data-lucide]').forEach(el => {
                    const p = LI[el.dataset.lucide];
                    if (!p) return;
                    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    s.setAttribute('viewBox', '0 0 24 24');
                    s.setAttribute('fill', 'none');
                    s.setAttribute('stroke', 'currentColor');
                    s.setAttribute('stroke-width', '1.6');
                    s.setAttribute('stroke-linecap', 'round');
                    s.setAttribute('stroke-linejoin', 'round');
                    s.setAttribute('aria-hidden', 'true');
                    s.setAttribute('class', el.getAttribute('class') || '');
                    s.innerHTML = p;
                    el.replaceWith(s);
                });
            }
        };

    <style>
        body {
            background-color: #fafafa;
            color: #334155;
            font-family: system-ui, -apple-system, sans-serif;
        }
#sport h1,#sport h2,#sport h3{font-family:inherit;margin:0;letter-spacing:-.01em}
#sport h1{font-size:34px;line-height:1.05}
#sport h2{font-size:22px}
#sport h3{font-size:18px}
#sport .top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
#sport .grow{flex:1;min-width:0}
#sport .mute{color:var(--mute);font-size:15px}
#sport .t{font-weight:600}
#sport svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#sport button{font:600 16px system-ui,sans-serif;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px}
#sport button.p{background:var(--acc);border-color:var(--acc);color:#fff}
#sport button.g{background:var(--soft);border-color:transparent}
#sport button.d{color:var(--acc)}
#sport button.s{padding:6px 11px;font-size:14px}
#sport button:focus-visible,#sport input:focus-visible,#sport select:focus-visible,#sport a:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
#sport input,#sport select{font:400 16px system-ui,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%}
#sport input.n{width:62px;text-align:center;padding:8px 4px}
#sport .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
#sport .row{display:flex;align-items:center;gap:10px}
#sport .hero{border-radius:22px;padding:18px;margin-bottom:12px;color:#fff;background:linear-gradient(135deg,#e0325a,#7a5ce6)}
#sport .hero h3{font-size:22px;margin-bottom:2px}
#sport .hero .mute{color:rgba(255,255,255,.85)}
#sport .hero button{background:#fff;color:#2b1736;border:0}
#sport .hero button.x{background:rgba(255,255,255,.2);color:#fff}
#sport .hero.ok{background:linear-gradient(135deg,#2a9d78,#3a7fb5)}
#sport .strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px}
#sport .strip button{padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:16px;font-size:13px;color:var(--mute)}
#sport .strip button b{font-size:18px;color:var(--ink);font-family:system-ui,sans-serif}
#sport .strip button.sel{background:var(--acc);border-color:var(--acc);color:#fff}
#sport .strip button.sel b{color:#fff}
#sport .strip button.today{border-color:var(--acc2)}
#sport .dot{width:6px;height:6px;border-radius:50%;background:transparent}

<script>
    const DEFAULT_TASKS = [
        "Réveil matinal sans snooze",
        "45 min de sport ou marche",
        "Lecture (10 pages minimum)",
        "Hydratation (2L d'eau)",
        "Pas d'alcool ni fast-food"
    ];

    let tasks = JSON.parse(localStorage.getItem('winter_arc_tasks')) || DEFAULT_TASKS;
    let history = JSON.parse(localStorage.getItem('winter_arc_history')) || {};
    let startDate = localStorage.getItem('winter_arc_start_date') || getBrusselsDateString();
    let currentCalendarDate = new Date();

    function getBrusselsDateString(d = new Date()) {
        const options = { timeZone: 'Europe/Brussels', year: 'numeric', month: '2-digit', day: '2-digit' };
        const formatter = new Intl.DateTimeFormat('fr-CA', options);
        return formatter.format(d);
    }

    function init() {
        document.getElementById('start-date-input').value = startDate;
        renderTasks();
        renderCalendar();
        renderProgress();
        updateHeader();
        lucide.createIcons();
    }

    function updateHeader() {
        const todayBrussels = new Date().toLocaleDateString('fr-FR', {
            timeZone: 'Europe/Brussels',
            weekday: 'long', day: 'numeric', month: 'long'
        });
        document.getElementById('current-date-display').innerText = todayBrussels;

        let streak = 0;
        let curr = new Date();
        while (true) {
            let key = getBrusselsDateString(curr);
            let dayData = history[key];
            if (dayData && dayData.completed && tasks.length > 0 && (dayData.completed.length / tasks.length) === 1) {
                streak++;
                curr.setDate(curr.getDate() - 1);
            } else if (key === getBrusselsDateString()) {
                curr.setDate(curr.getDate() - 1);
            } else {
                break;
            }
        }
        document.getElementById('streak-count').innerText = streak;
        document.getElementById('streak-label').innerText = streak > 1 ? 'jours' : 'jour';
    }

    const TAB_BASE = "flex-1 py-2.5 px-1 sm:px-3 rounded-xl text-xs sm:text-sm font-medium flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2 transition-all ";
    const TAB_ACTIVE = {
        daily: "bg-sky-100 text-sky-700 shadow-sm",
        sport: "bg-rose-100 text-rose-800 shadow-sm",
        calendar: "bg-emerald-100 text-emerald-800 shadow-sm",
        progress: "bg-amber-100 text-amber-800 shadow-sm"
    };

    const TABS = ['daily', 'sport', 'calendar', 'progress'];
    let currentTab = 'daily';
    function switchTab(tab, dir) {
        ['daily', 'sport', 'calendar', 'progress'].forEach(t => {
            document.getElementById(`view-${t}`).classList.add('hidden');
            document.getElementById(`tab-${t}`).className = TAB_BASE + "text-slate-500 hover:text-slate-800";
        });

        document.getElementById(`view-${tab}`).classList.remove('hidden');
        document.getElementById(`tab-${tab}`).className = TAB_BASE + TAB_ACTIVE[tab];

        if(tab === 'calendar') renderCalendar();
        if(tab === 'progress') renderProgress();

        currentTab = tab;
        const v = document.getElementById(`view-${tab}`);
        v.classList.remove('slide-l', 'slide-r');
        if (dir) { void v.offsetWidth; v.classList.add(dir > 0 ? 'slide-l' : 'slide-r'); window.scrollTo(0, 0); }
    }

    function renderTasks() {
        const todayKey = getBrusselsDateString();
        if (!history[todayKey]) {
            history[todayKey] = { completed: [] };
        }

        const taskListEl = document.getElementById('task-list');
        taskListEl.innerHTML = '';

        const completedSet = new Set(history[todayKey].completed);

        tasks.forEach((task, index) => {
            const isChecked = completedSet.has(task);
            const item = document.createElement('div');
            item.className = `flex items-center justify-between p-3.5 rounded-2xl border transition-all ${
                isChecked ? 'bg-sky-50/60 border-sky-200' : 'bg-slate-50/50 border-slate-100'
            }`;
            item.innerHTML = `
                <label class="flex items-center space-x-3 cursor-pointer flex-1">
                    <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleTask('${task.replace(/'/g, "\\'")}')" class="w-5 h-5 rounded-lg border-slate-300 text-sky-400 focus:ring-sky-300 bg-white">
                    <span class="text-sm font-medium ${isChecked ? 'line-through text-slate-400' : 'text-slate-700'}">${task}</span>
                </label>
                <button onclick="deleteTask(${index})" class="text-slate-300 hover:text-rose-400 p-1 transition-colors">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
            `;
            taskListEl.appendChild(item);
        });

        const pct = tasks.length > 0 ? Math.round((completedSet.size / tasks.length) * 100) : 0;
        document.getElementById('daily-progress-bar').style.width = `${pct}%`;
        document.getElementById('daily-completion-badge').innerText = `${pct}%`;

        lucide.createIcons();
    }

    function toggleTask(task) {
        const todayKey = getBrusselsDateString();
        let completed = history[todayKey].completed || [];

        if (completed.includes(task)) {
            completed = completed.filter(t => t !== task);
        } else {
            completed.push(task);
        }

        history[todayKey].completed = completed;
        localStorage.setItem('winter_arc_history', JSON.stringify(history));
        renderTasks();
        updateHeader();
    }

    function addTask(e) {
        e.preventDefault();
        const input = document.getElementById('new-task-input');
        const val = input.value.trim();
        if (val) {
            tasks.push(val);
            localStorage.setItem('winter_arc_tasks', JSON.stringify(tasks));
            input.value = '';
            renderTasks();
        }
    }

    function deleteTask(index) {
        tasks.splice(index, 1);
        localStorage.setItem('winter_arc_tasks', JSON.stringify(tasks));
        renderTasks();
    }

    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';

        const year = currentCalendarDate.getFullYear();
        const month = currentCalendarDate.getMonth();

        document.getElementById('calendar-month-title').innerText = new Date(year, month).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);

        let startingDay = firstDay.getDay() - 1;
        if (startingDay === -1) startingDay = 6;

        for (let i = 0; i < startingDay; i++) {
            grid.appendChild(document.createElement('div'));
        }

        for (let day = 1; day <= lastDay.getDate(); day++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const cell = document.createElement('div');

            const dayData = history[dateStr];
            let bgColor = 'bg-slate-50 text-slate-400 border-slate-100';

            if (dayData && dayData.completed && tasks.length > 0) {
                const ratio = dayData.completed.length / tasks.length;
                if (ratio === 1) {
                    bgColor = 'bg-emerald-100 text-emerald-800 border-emerald-200 font-bold'; // 100%
                } else if (ratio >= 0.5) {
                    bgColor = 'bg-amber-100 text-amber-800 border-amber-200 font-medium'; // >= 50%
                } else if (ratio > 0) {
                    bgColor = 'bg-rose-100 text-rose-800 border-rose-200 font-medium'; // < 50%
                }
            }

            const isToday = dateStr === getBrusselsDateString();

            cell.className = `aspect-square rounded-2xl border flex flex-col items-center justify-center text-xs transition-all ${bgColor} ${isToday ? 'ring-2 ring-sky-300' : ''}`;
            cell.innerText = day;
            grid.appendChild(cell);
        }
    }

    function changeMonth(delta) {
        currentCalendarDate.setMonth(currentCalendarDate.getMonth() + delta);
        renderCalendar();
    }

    function renderProgress() {
        const start = new Date(startDate);
        const today = new Date(getBrusselsDateString());

        const diffTime = today - start;
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;

        const currentDayNum = Math.max(1, Math.min(75, diffDays));
        const progressPct = Math.round((currentDayNum / 75) * 100);

        document.getElementById('total-progress-percent').innerText = `${progressPct}%`;
        document.getElementById('total-progress-days').innerText = `Jour ${currentDayNum} sur 75`;
        document.getElementById('total-progress-bar').style.width = `${progressPct}%`;
    }

    function updateStartDate(val) {
        if (val) {
            startDate = val;
            localStorage.setItem('winter_arc_start_date', val);
            renderProgress();
            updateHeader();
        }
    }

    window.onload = init;
</script>

 <div class="card"><h2 style="margin-bottom:10px">Ajouter un exercice</h2><input id="nn" placeholder="Nom de l'exercice" style="margin-bottom:8px"><select id="nt" style="margin-bottom:8px"><option value="reps">Se compte en répétitions</option><option value="time">Se compte en minutes</option></select><input id="ni" type="file" accept="image/*" style="margin-bottom:10px" aria-label="Photo (facultatif)"><button class="p" onclick="addEx()">Ajouter l'exercice</button></div>`}
function filt(){const s=q.toLowerCase();document.querySelectorAll(".lib").forEach(c=>c.style.display=(c.dataset.n.includes(s)&&(flt==="all"||c.dataset.k===flt))?"":"none")}
function addEx(){const n=$("#nn").value.trim();if(!n)return;const e={id:uid(),name:n,type:$("#nt").value},f=$("#ni").files[0];const fin=()=>{S.ex.push(e);save();draw()};f?shrink(f,u=>{e.img=u;fin()}):fin()}
function setImg(id,f){if(!f)return;shrink(f,u=>{E(id).img=u;save();draw()})}
function delEx(id){if(!confirm("Supprimer cet exercice ?"))return;S.ex=S.ex.filter(e=>e.id!==id);save();draw()}

function editS(id){edit=id?JSON.parse(JSON.stringify(sOf(id))):{id:uid(),name:"",blocks:[],isNew:true};draw();scrollTo(0,0)}
const opts=()=>S.ex.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join("");
function dEdit(){return `<div class="top"><h1 class="grow">${edit.isNew?"Nouvelle séance":"Modifier"}</h1></div><p class="mute">Un bloc est un exercice seul ou un superset (2 à 3 exercices à la suite).</p>
 <div class="card"><input placeholder="Nom de la séance" value="${esc(edit.name)}" oninput="edit.name=this.value" aria-label="Nom de la séance"></div>
 ${edit.blocks.map((b,i)=>`<div class="card"><div class="row"><div class="t grow">${b.items.length>1?"Superset de "+b.items.length:"Exercice seul"}</div><span class="mute">Séries</span><input class="n" type="number" min="1" value="${b.sets}" onchange="edit.blocks[${i}].sets=+this.value||1" aria-label="Séries">
 <button class="s g" onclick="mvB(${i},-1)" aria-label="Monter">↑</button><button class="s g" onclick="mvB(${i},1)" aria-label="Descendre">↓</button><button class="s d" onclick="edit.blocks.splice(${i},1);draw()" aria-label="Supprimer le bloc">✕</button></div>
 <div class="blk">${b.items.map((it,j)=>`<div class="row" style="margin-bottom:8px"><div class="grow">${esc(E(it.exId).name)}</div><input class="n" type="number" min="1" value="${it.val}" aria-label="${E(it.exId).type==="time"?"Minutes":"Répétitions"}" onchange="edit.blocks[${i}].items[${j}].val=+this.value||1"><span class="mute">${E(it.exId).type==="time"?"min":"rép."}</span><button class="s d" onclick="rmIt(${i},${j})" aria-label="Retirer">✕</button></div>`).join("")}
 ${b.items.length<3?`<div class="row"><select id="add${i}" aria-label="Exercice à ajouter">${opts()}</select><button class="s g" onclick="addIt(${i})">+ Superset</button></div>`:""}</div></div>`).join("")}
 <div class="card"><div class="row"><select id="newb" aria-label="Exercice">${opts()}</select><button class="g" onclick="newB()">Ajouter un bloc</button></div></div>
 <div class="row"><button class="p grow" onclick="saveS()">Enregistrer</button><button onclick="go('sessions')">Annuler</button></div>${edit.isNew?"":`<p><button class="d" onclick="delS()">Supprimer cette séance</button></p>`}`}
const dv=id=>E(id).type==="time"?10:8;
function newB(){const id=$("#newb").value;if(!id)return;edit.blocks.push({id:uid(),sets:1,items:[{exId:id,val:dv(id)}]});draw()}
function addIt(i){const id=$("#add"+i).value;edit.blocks[i].items.push({exId:id,val:dv(id)});draw()}
function rmIt(i,j){const b=edit.blocks[i];b.items.splice(j,1);if(!b.items.length)edit.blocks.splice(i,1);draw()}
function mvB(i,d){const j=i+d;if(j<0||j>=edit.blocks.length)return;[edit.blocks[i],edit.blocks[j]]=[edit.blocks[j],edit.blocks[i]];draw()}
function saveS(){if(!edit.name.trim()){alert("Donne un nom à la séance.");return}const{isNew,...s}=edit,i=S.sessions.findIndex(x=>x.id===s.id);i>=0?S.sessions[i]=s:S.sessions.push(s);save();go("sessions")}
function delS(){if(!confirm("Supprimer cette séance ?"))return;S.sessions=S.sessions.filter(s=>s.id!==edit.id);save();go("sessions")}

function start(id,date){run={s:sOf(id),date:date||today(),done:{},fin:false};draw();scrollTo(0,0)}
function dRun(){let tot=0,n=0;run.s.blocks.forEach((b,bi)=>{for(let k=1;k<=b.sets;k++)b.items.forEach((_,j)=>{tot++;if(run.done[bi+"-"+k+"-"+j])n++})});const pct=tot?Math.round(n/tot*100):0;
 let h=`<div class="bar" role="progressbar" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div><div class="top"><h1 class="grow">${esc(run.s.name)}</h1><button class="s g" onclick="go('week')">Quitter</button></div>`;
 run.s.blocks.forEach((b,bi)=>{h+=`<div class="card"><div class="t" style="margin-bottom:4px">${b.items.length>1?"Superset de "+b.items.length+" · "+b.sets+" série"+(b.sets>1?"s":""):(b.sets+" série"+(b.sets>1?"s":""))}</div>`;
  for(let k=1;k<=b.sets;k++){if(b.sets>1)h+=`<div class="mute" style="margin-top:6px">Série ${k}/${b.sets}</div>`;
   b.items.forEach((it,j)=>{const key=bi+"-"+k+"-"+j,e=E(it.exId);h+=`<label class="step ${run.done[key]?"done":""}"><input type="checkbox" ${run.done[key]?"checked":""} onchange="run.done['${key}']=this.checked;draw()">${th(e,84)}<div><div class="t">${esc(e.name)}</div><div class="mute">${unit(it.exId,it.val)}</div></div></label>`})}
  h+=`</div>`});
 if(run.fin)return h+`<div class="card"><div class="t">Douleur au dos après la séance (0 à 10, facultatif)</div><input id="dos" type="number" min="0" max="10" style="margin:10px 0" aria-label="Douleur au dos"><button class="p" onclick="finish()">Enregistrer la séance</button></div>`;
 return h+`<button class="p" style="width:100%" onclick="run.fin=true;draw()">Terminer la séance</button>`}
function finish(){const v=$("#dos").value;S.log.push({t:Date.now(),date:run.date,sid:run.s.id,name:run.s.name,dos:v===""?"":+v});save();checkTasks(run.date);tab="hist";run=null;draw();scrollTo(0,0)}
draw();

function checkTasks(d){if(d!==today())return;try{const k=today();history[k]=history[k]||{completed:[]};tasks.filter(t=>/sport|marche|pilates|renfo|yoga|s[eé]ance/i.test(t)).forEach(t=>{if(!history[k].completed.includes(t))history[k].completed.push(t)});localStorage.setItem("winter_arc_history",JSON.stringify(history));renderTasks();updateHeader()}catch(e){}}


let _day=getBrusselsDateString();
function tickDay(){const d=getBrusselsDateString();if(d===_day)return;_day=d;renderTasks();renderCalendar();renderProgress();updateHeader();sel=d;wk=mon(new Date(d+"T12:00"));draw()}
setInterval(tickDay,60000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)tickDay()});

/* ===== Ouverture de l'app ===== */
(function(){
  const sp=document.getElementById("splash");if(!sp)return;
  const h=+new Intl.DateTimeFormat("fr-FR",{timeZone:"Europe/Brussels",hour:"numeric",hour12:false}).format(new Date());
  document.getElementById("sp-hello").textContent=h>=18||h<4?"Bonsoir":"Bonjour";
  let gone=false;const close=()=>{if(gone)return;gone=true;sp.classList.add("out");setTimeout(()=>sp.remove(),700)};
  sp.addEventListener("click",close);setTimeout(close,matchMedia("(prefers-reduced-motion:reduce)").matches?600:2300);
})();
/* ===== Glisser d'un onglet à l'autre ===== */
(function(){
  let sx=0,sy=0,st=0,on=false;
  const scrollableX=el=>{for(;el&&el!==document.body;el=el.parentElement){const o=getComputedStyle(el).overflowX;if((o==="auto"||o==="scroll")&&el.scrollWidth>el.clientWidth)return true}return false};
  document.addEventListener("touchstart",e=>{
    const t=e.touches[0],el=e.target;
    on=e.touches.length===1&&!document.getElementById("splash")&&!el.closest("input,select,textarea")&&!scrollableX(el)&&t.clientX>24&&t.clientX<innerWidth-24;
    sx=t.clientX;sy=t.clientY;st=Date.now();
  },{passive:true});
  document.addEventListener("touchend",e=>{
    if(!on)return;on=false;
    const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*.6||Date.now()-st>700)return;
    const i=TABS.indexOf(currentTab),n=i+(dx<0?1:-1);
    if(n>=0&&n<TABS.length)switchTab(TABS[n],dx<0?1:-1);
  },{passive:true});
})();
</script>
</body>
