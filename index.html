<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Arc Challenge - 75 Jours</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<div class="min-h-screen flex flex-col justify-between max-w-2xl mx-auto px-4 py-6">

    <!-- Header -->
    <header class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
        <div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">
                WINTER ARC
            </h1>
            <p id="current-date-display" class="text-xs text-slate-400 mt-1"></p>
        </div>
        <div class="flex items-center space-x-2 bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700">
            <i data-lucide="flame" class="w-4 h-4 text-orange-500"></i>
            <span id="streak-count" class="text-sm font-semibold text-slate-200">0 jours</span>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="flex space-x-2 bg-slate-900/80 p-1.5 rounded-xl border border-slate-800 mb-6">
        <button onclick="switchTab('daily')" id="tab-daily" class="flex-1 py-2.5 px-3 rounded-lg text-sm font-medium flex items-center justify-center space-x-2 transition-all bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
            <i data-lucide="check-square" class="w-4 h-4"></i>
            <span>Tâches</span>
        </button>
        <button onclick="switchTab('calendar')" id="tab-calendar" class="flex-1 py-2.5 px-3 rounded-lg text-sm font-medium flex items-center justify-center space-x-2 transition-all text-slate-400 hover:text-slate-200">
            <i data-lucide="calendar" class="w-4 h-4"></i>
            <span>Calendrier</span>
        </button>
        <button onclick="switchTab('progress')" id="tab-progress" class="flex-1 py-2.5 px-3 rounded-lg text-sm font-medium flex items-center justify-center space-x-2 transition-all text-slate-400 hover:text-slate-200">
            <i data-lucide="trophy" class="w-4 h-4"></i>
            <span>Progression</span>
        </button>
    </nav>

    <!-- PAGE 1: TACHES DU JOUR -->
    <main id="view-daily" class="space-y-6 flex-grow">
        <div class="bg-slate-900/60 rounded-2xl p-5 border border-slate-800">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold flex items-center gap-2">
                    <i data-lucide="list-todo" class="w-5 h-5 text-emerald-400"></i>
                    Objectifs du jour
                </h2>
                <span id="daily-completion-badge" class="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 font-medium">0%</span>
            </div>

            <!-- Progression du jour -->
            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-6">
                <div id="daily-progress-bar" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-full w-0 transition-all duration-500"></div>
            </div>

            <!-- Liste des tâches -->
            <div id="task-list" class="space-y-3">
                <!-- Généré par JS -->
            </div>

            <!-- Ajouter une tâche -->
            <form onsubmit="addTask(event)" class="mt-5 flex gap-2">
                <input type="text" id="new-task-input" placeholder="Ajouter une nouvelle habitude..." class="flex-1 bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-200 placeholder-slate-500">
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white p-2.5 rounded-xl transition-colors">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
            </form>
        </div>
    </main>

    <!-- PAGE 2: CALENDRIER -->
    <main id="view-calendar" class="space-y-6 flex-grow hidden">
        <div class="bg-slate-900/60 rounded-2xl p-5 border border-slate-800">
            <div class="flex justify-between items-center mb-6">
                <h2 id="calendar-month-title" class="text-lg font-semibold">Mois</h2>
                <div class="flex gap-2">
                    <button onclick="changeMonth(-1)" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                    <button onclick="changeMonth(1)" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
                </div>
            </div>

            <!-- Jours de la semaine -->
            <div class="grid grid-cols-7 gap-2 text-center text-xs font-semibold text-slate-500 mb-2">
                <div>LUN</div><div>MAR</div><div>MER</div><div>JEU</div><div>VEN</div><div>SAM</div><div>DIM</div>
            </div>

            <!-- Grille du calendrier -->
            <div id="calendar-grid" class="grid grid-cols-7 gap-2">
                <!-- Généré par JS -->
            </div>

            <!-- Légende -->
            <div class="flex items-center justify-around mt-6 text-xs text-slate-400 pt-4 border-t border-slate-800">
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-emerald-500"></span> 100% Validé</div>
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-amber-500"></span> Partiel</div>
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-slate-800 border border-slate-700"></span> Incomplet / Futur</div>
            </div>
        </div>
    </main>

    <!-- PAGE 3: PROGRESSION 75 JOURS -->
    <main id="view-progress" class="space-y-6 flex-grow hidden">
        <div class="bg-slate-900/60 rounded-2xl p-5 border border-slate-800 space-y-6">
            <h2 class="text-lg font-semibold flex items-center gap-2">
                <i data-lucide="flag" class="w-5 h-5 text-emerald-400"></i>
                Progression du Winter Arc (75 Jours)
            </h2>

            <!-- Grande jauge % -->
            <div class="text-center py-4 bg-slate-800/40 rounded-2xl border border-slate-800">
                <div id="total-progress-percent" class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 mb-1">0%</div>
                <div id="total-progress-days" class="text-sm text-slate-400">Jour 1 sur 75</div>
            </div>

            <!-- Barre de progression globale -->
            <div class="space-y-2">
                <div class="flex justify-between text-xs text-slate-400">
                    <span>Début du Challenge</span>
                    <span>Objectif 75 Jours</span>
                </div>
                <div class="w-full bg-slate-800 h-4 rounded-full overflow-hidden p-0.5 border border-slate-700">
                    <div id="total-progress-bar" class="bg-gradient-to-r from-emerald-500 via-teal-400 to-cyan-400 h-full rounded-full w-0 transition-all duration-700"></div>
                </div>
            </div>

            <!-- Date de début paramétrable -->
            <div class="pt-4 border-t border-slate-800">
                <label class="block text-xs font-medium text-slate-400 mb-2">Date de démarrage du challenge :</label>
                <input type="date" id="start-date-input" onchange="updateStartDate(this.value)" class="bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-xl px-3 py-2 w-full focus:outline-none focus:border-emerald-500">
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-8 text-center text-xs text-slate-500">
        Winter Arc App &bull; Données sauvegardées en local
    </footer>
</div>

<script>
    // Configuration par défaut
    const DEFAULT_TASKS = [
        "Réveil matinal sans snooze",
        "45 min de sport ou marche",
        "Lecture (10 pages minimum)",
        "Hydratation (2L d'eau)",
        "Pas d'alcool ni fast-food"
    ];

    // State Application
    let tasks = JSON.parse(localStorage.getItem('winter_arc_tasks')) || DEFAULT_TASKS;
    let history = JSON.parse(localStorage.getItem('winter_arc_history')) || {};
    let startDate = localStorage.getItem('winter_arc_start_date') || getBrusselsDateString();
    let currentCalendarDate = new Date();

    // Utilitaires de Date (Heure de Belgique)
    function getBrusselsDateString(d = new Date()) {
        const options = { timeZone: 'Europe/Brussels', year: 'numeric', month: '2-digit', day: '2-digit' };
        const formatter = new Intl.DateTimeFormat('fr-CA', options); // Format AAAA-MM-JJ
        return formatter.format(d);
    }

    function init() {
        document.getElementById('start-date-input').value = startDate;
        renderTasks();
        renderCalendar();
        renderProgress();
        updateHeader();
        lucide.createIcons();
    }

    // Gestion du Header
    function updateHeader() {
        const todayBrussels = new Date().toLocaleDateString('fr-FR', {
            timeZone: 'Europe/Brussels',
            weekday: 'long', day: 'numeric', month: 'long'
        });
        document.getElementById('current-date-display').innerText = todayBrussels;

        // Calcul du Streak (Série)
        let streak = 0;
        let curr = new Date();
        while (true) {
            let key = getBrusselsDateString(curr);
            let dayData = history[key];
            if (dayData && dayData.completed && dayData.completed.length === tasks.length && tasks.length > 0) {
                streak++;
                curr.setDate(curr.getDate() - 1);
            } else if (key === getBrusselsDateString()) {
                // Si aujourd'hui n'est pas encore fini, on vérifie hier
                curr.setDate(curr.getDate() - 1);
            } else {
                break;
            }
        }
        document.getElementById('streak-count').innerText = `${streak} jour${streak > 1 ? 's' : ''}`;
    }

    // Changement d'Onglet
    function switchTab(tab) {
        ['daily', 'calendar', 'progress'].forEach(t => {
            document.getElementById(`view-${t}`).classList.add('hidden');
            const btn = document.getElementById(`tab-${t}`);
            btn.className = "flex-1 py-2.5 px-3 rounded-lg text-sm font-medium flex items-center justify-center space-x-2 transition-all text-slate-400 hover:text-slate-200";
        });

        document.getElementById(`view-${tab}`).classList.remove('hidden');
        const activeBtn = document.getElementById(`tab-${tab}`);
        activeBtn.className = "flex-1 py-2.5 px-3 rounded-lg text-sm font-medium flex items-center justify-center space-x-2 transition-all bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";

        if(tab === 'calendar') renderCalendar();
        if(tab === 'progress') renderProgress();
    }

    // --- PAGE 1 : DAILY TASKS ---
    function renderTasks() {
        const todayKey = getBrusselsDateString();
        if (!history[todayKey]) {
            history[todayKey] = { completed: [] };
        }

        const taskListEl = document.getElementById('task-list');
        taskListEl.innerHTML = '';

        const completedSet = new Set(history[todayKey].completed);

        tasks.forEach((task, index) => {
            const isChecked = completedSet.has(task);
            const item = document.createElement('div');
            item.className = `flex items-center justify-between p-3.5 rounded-xl border transition-all ${
                isChecked ? 'bg-emerald-950/20 border-emerald-500/30' : 'bg-slate-800/40 border-slate-700/50'
            }`;
            item.innerHTML = `
                <label class="flex items-center space-x-3 cursor-pointer flex-1">
                    <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleTask('${task.replace(/'/g, "\\'")}')" class="w-5 h-5 rounded border-slate-600 text-emerald-500 focus:ring-emerald-500 bg-slate-800">
                    <span class="text-sm font-medium ${isChecked ? 'line-through text-slate-400' : 'text-slate-200'}">${task}</span>
                </label>
                <button onclick="deleteTask(${index})" class="text-slate-500 hover:text-red-400 p-1">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
            `;
            taskListEl.appendChild(item);
        });

        // Mise à jour de la barre
        const pct = tasks.length > 0 ? Math.round((completedSet.size / tasks.length) * 100) : 0;
        document.getElementById('daily-progress-bar').style.width = `${pct}%`;
        document.getElementById('daily-completion-badge').innerText = `${pct}%`;

        lucide.createIcons();
    }

    function toggleTask(task) {
        const todayKey = getBrusselsDateString();
        let completed = history[todayKey].completed || [];

        if (completed.includes(task)) {
            completed = completed.filter(t => t !== task);
        } else {
            completed.push(task);
        }

        history[todayKey].completed = completed;
        localStorage.setItem('winter_arc_history', JSON.stringify(history));
        renderTasks();
        updateHeader();
    }

    function addTask(e) {
        e.preventDefault();
        const input = document.getElementById('new-task-input');
        const val = input.value.trim();
        if (val) {
            tasks.push(val);
            localStorage.setItem('winter_arc_tasks', JSON.stringify(tasks));
            input.value = '';
            renderTasks();
        }
    }

    function deleteTask(index) {
        tasks.splice(index, 1);
        localStorage.setItem('winter_arc_tasks', JSON.stringify(tasks));
        renderTasks();
    }

    // --- PAGE 2 : CALENDRIER ---
    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';

        const year = currentCalendarDate.getFullYear();
        const month = currentCalendarDate.getMonth();

        document.getElementById('calendar-month-title').innerText = new Date(year, month).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);

        // Ajuster pour commencer le lundi (0 = Lundi, 6 = Dimanche)
        let startingDay = firstDay.getDay() - 1;
        if (startingDay === -1) startingDay = 6;

        for (let i = 0; i < startingDay; i++) {
            grid.appendChild(document.createElement('div'));
        }

        for (let day = 1; day <= lastDay.getDate(); day++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const cell = document.createElement('div');

            const dayData = history[dateStr];
            let bgColor = 'bg-slate-800/40 text-slate-400 border-slate-800';

            if (dayData && dayData.completed) {
                const count = dayData.completed.length;
                if (count > 0 && count === tasks.length) {
                    bgColor = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50 font-bold';
                } else if (count > 0) {
                    bgColor = 'bg-amber-500/20 text-amber-400 border-amber-500/50';
                }
            }

            const isToday = dateStr === getBrusselsDateString();

            cell.className = `aspect-square rounded-xl border flex flex-col items-center justify-center text-xs transition-all ${bgColor} ${isToday ? 'ring-2 ring-emerald-400' : ''}`;
            cell.innerText = day;
            grid.appendChild(cell);
        }
    }

    function changeMonth(delta) {
        currentCalendarDate.setMonth(currentCalendarDate.getMonth() + delta);
        renderCalendar();
    }

    // --- PAGE 3 : PROGRESSION 75 JOURS ---
    function renderProgress() {
        const start = new Date(startDate);
        const today = new Date(getBrusselsDateString());

        const diffTime = today - start;
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;

        const currentDayNum = Math.max(1, Math.min(75, diffDays));
        const progressPct = Math.round((currentDayNum / 75) * 100);

        document.getElementById('total-progress-percent').innerText = `${progressPct}%`;
        document.getElementById('total-progress-days').innerText = `Jour ${currentDayNum} sur 75`;
        document.getElementById('total-progress-bar').style.width = `${progressPct}%`;
    }

    function updateStartDate(val) {
        if (val) {
            startDate = val;
            localStorage.setItem('winter_arc_start_date', val);
            renderProgress();
            updateHeader();
        }
    }

    // Lancement au chargement
    window.onload = init;
</script>
</body>
</html>
